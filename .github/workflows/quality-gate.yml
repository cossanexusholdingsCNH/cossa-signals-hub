name: Quality Gate

on:
  push:
    branches:
      - main
      - 'upgrade/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Verify lockfile is synchronized
        run: git diff --exit-code -- bun.lock

      - name: Run deterministic tests
        run: bun run test

      - name: Run lint
        run: bun run lint

      - name: Build application
        run: bun run build
